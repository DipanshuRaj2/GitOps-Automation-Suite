name: CI/CD Pipeline for Static Website

on:
  push:
    branches:
      - main
    paths:
      - '.html'
      - '.css'
      - Dockerfile
      - nginx.conf

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Clean system locks & update
        run: |
          sudo rm -f /var/lib/apt/lists/lock
          sudo rm -f /var/lib/dpkg/lock*
          sudo apt-get update -y
          sudo apt-get install -y apt-transport-https ca-certificates curl software-properties-common

      - name: Set Docker permissions
        run: |
          sudo chmod 666 /var/run/docker.sock
          sudo usermod -aG docker $USER
          sudo systemctl restart docker || true

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          install: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Remove old container (if running)
        run: |
          docker rm -f my-static-website || true

      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/my-static-website:latest

      - name: Pull latest image
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/my-static-website:latest

      - name: Run Docker container on port 8090
        run: |
          docker run -d --name my-static-website -p 8090:8090 ${{ secrets.DOCKER_USERNAME }}/my-static-website:latest

      - name: Post-deployment verification
        run: |
          echo "Deployed! Checking running containers..."
          docker ps

      - name: Clean up apt cache
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Notify on failure
        if: failure()
        run: echo "Deployment failed. Check logs."

      - name: Notify on success
        if: success()
        run: echo "✅ Static website successfully deployed on port 8090!"
